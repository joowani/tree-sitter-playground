name: publish

run-name: Publish v${{ github.event.client_payload.version }}

on:
  # Send event_type=publish with client_payload.version through the repository dispatch API.
  repository_dispatch:
    types: [publish]

concurrency:
  group: publish-${{ github.event.client_payload.version }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.event.client_payload.version }}
  IMAGE: ghcr.io/joowani/tree-sitter-playground

jobs:
  # The tag records the commit a version is built from, so dispatching the same version again completes a release that
  # failed partway:
  #
  # - With no tag, the current commit is tagged.
  # - While nothing of the version is published, the tag moves to the current commit, so a fix can be released.
  # - Once anything is published, the rest is built from the tagged commit, so the release never mixes two commits.
  #   The workflow itself still runs from the current commit, so fixes to it take effect.
  #
  # The crate is published before the image and the GitHub release, so the version is partly published exactly when
  # the crate is.
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate release source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
              echo "release resolved to $GITHUB_REF instead of $expected_ref" >&2
              exit 1
          fi

      - name: Choose the commit to release
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Any answer other than found or missing stops the release, since guessing wrong could mix two commits.
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --user-agent "tree-sitter-playground release workflow (https://github.com/$GH_REPO)" \
              "https://crates.io/api/v1/crates/tree-sitter-playground/$VERSION")"
          case "$status" in
              200) published=true ;;
              404) published=false ;;
              *) echo "crates.io answered $status while checking tree-sitter-playground $VERSION" >&2; exit 1 ;;
          esac

          if tag_ref_response="$(gh api --include "repos/$GH_REPO/git/ref/tags/v$VERSION" 2>&1)"; then
              tag_commit="$(gh api "repos/$GH_REPO/commits/v$VERSION" --jq .sha)"
          elif grep -qE '^HTTP/[0-9.]+ 404 ' <<<"$tag_ref_response"; then
              tag_commit=""
          else
              echo "GitHub could not confirm whether tag v$VERSION exists" >&2
              printf '%s\n' "$tag_ref_response" >&2
              exit 1
          fi

          if [[ -z "$tag_commit" ]]; then
              echo "tagging $GITHUB_SHA as v$VERSION"
              { echo "sha=$GITHUB_SHA"; echo "tag=create"; } >> "$GITHUB_OUTPUT"
          elif [[ "$tag_commit" == "$GITHUB_SHA" ]]; then
              { echo "sha=$GITHUB_SHA"; echo "tag=keep"; } >> "$GITHUB_OUTPUT"
          elif [[ "$published" == false ]]; then
              echo "nothing of v$VERSION is published yet, so the tag moves from $tag_commit to $GITHUB_SHA"
              { echo "sha=$GITHUB_SHA"; echo "tag=move"; } >> "$GITHUB_OUTPUT"
          else
              echo "::notice::v$VERSION is partly published, so the rest is built from $tag_commit"
              { echo "sha=$tag_commit"; echo "tag=keep"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the commit to release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.commit.outputs.sha }}

      - name: Validate version and tag the commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ steps.commit.outputs.sha }}
          TAG_ACTION: ${{ steps.commit.outputs.tag }}
        run: |
          scripts/publish --check "$VERSION"
          case "$TAG_ACTION" in
              create) gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$COMMIT" >/dev/null ;;
              move) gh api -X PATCH "repos/$GH_REPO/git/refs/tags/v$VERSION" -f sha="$COMMIT" -F force=true >/dev/null ;;
          esac

  check:
    name: Check
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.validate.outputs.commit }}

  # Each architecture builds on a native runner and pushes its image by digest, without a tag. publish-image tags the
  # two together once the crate is published.
  build-image:
    name: Build Image (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # The runner is native, so the image it built can serve the playground.
      - name: Test image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --detach --name playground --publish 3000:3000 "$IMAGE@$DIGEST"
          for _ in $(seq 30); do
              if curl --silent --fail http://127.0.0.1:3000/api/languages | grep -q '"kotlin"'; then
                  exit 0
              fi
              sleep 1
          done
          docker logs playground
          exit 1

      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir digests
          touch "digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  publish-crate:
    name: Publish Crate
    needs: [validate, check, build-image]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: scripts/publish "$VERSION"

  publish-image:
    name: Publish Image
    needs: publish-crate
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # A published version keeps its image, since a rebuilt one differs. `latest` follows the newest version on
      # crates.io, so releasing a fix for an older version does not move it.
      - name: Tag image
        run: |
          if output="$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1)"; then
              echo "$IMAGE:$VERSION is already published; nothing to do"
              exit 0
          elif ! grep -qi 'not found' <<<"$output"; then
              printf '%s\n' "$output" >&2
              exit 1
          fi
          newest="$(curl --silent --show-error --fail \
              --user-agent "tree-sitter-playground release workflow (https://github.com/$GITHUB_REPOSITORY)" \
              https://crates.io/api/v1/crates/tree-sitter-playground | jq -r .crate.max_stable_version)"
          tags=(--tag "$IMAGE:$VERSION")
          if [[ "$VERSION" == "$newest" ]]; then
              tags+=(--tag "$IMAGE:latest")
          fi
          sources=()
          for digest in digests/*; do
              sources+=("$IMAGE@sha256:${digest#digests/}")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  publish-release:
    name: Publish GitHub Release
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! is_draft="$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)"; then
              gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes
          elif [[ "$is_draft" == true ]]; then
              gh release edit "v$VERSION" --draft=false
          else
              echo "release v$VERSION is already published; nothing to do"
          fi
